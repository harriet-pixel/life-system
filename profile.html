<div class="dashboard profile-dashboard">
<section class="avatar-section" aria-label="使用者頭像"><div class="user-avatar-frame"><svg id="avatar-placeholder" viewBox="0 0 160 200" role="img" aria-label="預設頭像"><circle cx="80" cy="65" r="28"/><path d="M25 170c0-65 110-65 110 0"/></svg><img id="user-avatar" alt="使用者頭像" hidden></div></section>
<section class="personal-heading"><div class="profile-identity"><h1 id="profile-name">尚未設定稱呼</h1><span id="current-page-name" class="current-page-name desktop-page-name"></span></div><span id="profile-age"></span><button id="edit-profile" class="toolbar-button" type="button" aria-label="編輯個人資料"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m15 4 5 5-11 11H4v-5ZM13 6l5 5"/></svg></button></section>
<div class="profile-portrait-column"><div class="profile-summary-area"><div class="profile-summary" id="profile-stats" role="group" aria-label="累積經驗、等級與貨幣"></div><p id="profile-motto" hidden></p></div>
<section class="photo-section" aria-label="使用者照片">
<div class="photo-frame"><svg id="default-avatar" viewBox="0 0 160 200" role="img" aria-label="預設頭像"><circle cx="80" cy="65" r="28"/><path d="M25 170c0-65 110-65 110 0"/></svg><img id="user-photo" alt="使用者照片" hidden></div>
</section></div>
<div class="profile-content"><div class="activity-tabs" role="tablist" aria-label="我的資料內容"><button id="abilities-tab" role="tab" aria-controls="abilities-panel" aria-selected="true"><span>能力值</span><span class="tab-english" lang="en">Attributes</span></button><button id="history-tab" data-tab-scroll-align="start" role="tab" aria-controls="history-panel" aria-selected="false" tabindex="-1"><span>歷史紀錄</span><span class="tab-english" lang="en">History</span></button></div>
<section id="abilities-panel" role="tabpanel" aria-labelledby="abilities-tab" tabindex="0"><p id="abilities-missing" class="small-note">尚未定義五項能力，待確認名稱、順序與資料來源。</p><div class="ability-charts" hidden><div id="ability-radar"></div></div></section>
<section id="history-panel" role="tabpanel" aria-labelledby="history-tab" tabindex="0" hidden><p id="history-empty" class="small-note">尚無操作紀錄。</p><p id="history-retention-note" class="small-note">保留最近 50 筆操作紀錄</p><ol id="history-list" class="history-list"></ol><nav id="history-pagination" class="history-pagination" aria-label="歷史紀錄分頁" hidden><div class="history-page-controls"><label class="history-jump" for="history-jump">跳至第 <select id="history-jump" aria-label="跳至歷史紀錄頁面"></select> 頁</label><span id="history-page" aria-live="polite"></span></div><div class="history-step-controls"><button id="history-previous" type="button">上一頁</button><button id="history-next" type="button">下一頁</button></div><div id="history-direct-jump" class="history-direct-jump"><label for="history-input">跳至第 <input id="history-input" inputmode="numeric" type="text" aria-describedby="history-page-error"> 頁</label><button id="history-go" type="button">前往</button></div><p id="history-page-error" class="field-error" role="alert" hidden></p></nav></section>

<dialog id="profile-dialog" aria-labelledby="edit-title"><form id="profile-form" novalidate>
<h2 id="edit-title">使用者設定</h2>
<div id="settings-tabs" class="activity-tabs" role="tablist" aria-label="使用者設定">
<button type="button" id="personal-settings-tab" role="tab" aria-controls="personal-settings" aria-selected="true">基本資料</button>
<button type="button" id="photo-settings-tab" role="tab" aria-controls="photo-settings" aria-selected="false" tabindex="-1">立繪上傳</button>
<button type="button" id="values-settings-tab" role="tab" aria-controls="values-settings" aria-selected="false" tabindex="-1">數值修改</button>
</div>
<div class="settings-scroll">
<section id="personal-settings" role="tabpanel" aria-labelledby="personal-settings-tab" tabindex="0">
<p id="profile-help" class="small-note">可自由留白，填寫內容將作為未來 AI 夥伴生成與互動的參考。</p>
<label>稱呼<input name="name" autocomplete="nickname"></label><div class="personal-details-row"><label class="age-inline"><span>年齡：</span><input name="age" inputmode="numeric" aria-describedby="age-error"></label><div id="gender-options" role="group" aria-labelledby="gender-label"><span id="gender-label">性別：</span><input type="hidden" name="gender"><div class="gender-choices"><label class="gender-choice"><input type="checkbox" name="gender-choice" value="男">男</label><label class="gender-choice"><input type="checkbox" name="gender-choice" value="女">女</label></div></div></div><span id="age-error" class="field-error"></span><label>一句話<input name="motto" aria-describedby="motto-help"><span id="motto-help" class="small-note">寫下一句想對自己說的話。</span></label><label>個人簡介<textarea name="bio" rows="1"></textarea></label><label>禁忌<textarea name="boundaries" rows="1"></textarea></label>
</section>
<section id="values-settings" role="tabpanel" aria-labelledby="values-settings-tab" tabindex="0" hidden>

<div id="manual-fields"></div>
<details id="ability-edit-details"><summary>修改能力值</summary><p class="small-note">能力增加或減少多少，經驗值就增減多少，畫面經驗值最低為 0、等級最低為 1；不改動其他能力或貨幣。</p><div id="manual-abilities"></div></details><button id="restart-values" type="button" aria-describedby="restart-values-help">重新開始</button><p id="restart-values-help" class="small-note">將等級、經驗值、貨幣與能力回復初始值，按「儲存」後套用。</p><p id="values-reset-status" class="small-note" role="status"></p>
</section>
<section id="photo-settings" role="tabpanel" aria-labelledby="photo-settings-tab" tabindex="0" hidden>
<div id="image-tabs" class="image-tabs" role="tablist" aria-label="圖片設定">
<button id="portrait-settings-tab" type="button" role="tab" aria-controls="portrait-settings" aria-selected="true">立繪</button>
<button id="avatar-settings-tab" type="button" role="tab" aria-controls="avatar-settings" aria-selected="false" tabindex="-1">頭像</button>
<button id="library-settings-tab" type="button" role="tab" aria-controls="library-settings" aria-selected="false" tabindex="-1">最愛</button>
</div>
<section id="portrait-settings" role="tabpanel" aria-labelledby="portrait-settings-tab" tabindex="0">
<div class="draft-image-preview"><img id="draft-photo" alt="使用者立繪草稿預覽" hidden><span id="draft-photo-empty">尚未上傳立繪</span></div>
<button id="choose-photo" type="button" aria-describedby="photo-error">選擇／更換立繪</button><input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="photo-error" hidden>
<p id="photo-error" class="field-error"></p>
<button id="start-portrait-crop" type="button" hidden>裁切</button>
<div id="portrait-editor" hidden>
<canvas id="portrait-canvas" width="300" height="400" tabindex="0" aria-label="立繪裁切區，可拖曳圖片或用方向鍵移動"></canvas>
<div class="crop-controls"><label>縮放<input id="portrait-zoom" type="range" min="1" max="4" step="0.01" value="1"></label></div>
<button id="confirm-portrait-crop" type="button">確認裁切</button><button id="cancel-portrait-crop" type="button">取消裁切</button></div>
</section><section id="avatar-settings" role="tabpanel" aria-labelledby="avatar-settings-tab" tabindex="0" hidden>
<div class="draft-avatar-frame"><img id="draft-avatar" alt="使用者頭像草稿預覽" hidden><span id="draft-avatar-empty">尚未設定頭像</span></div>
<button id="choose-avatar" type="button" aria-describedby="avatar-error">選擇／更換頭像圖片</button><input id="avatar-input" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="avatar-error" hidden>
<div class="avatar-image-actions"><button id="start-avatar-crop" type="button" disabled>裁切</button><button id="crop-from-photo" type="button" aria-describedby="crop-source-help">使用立繪</button></div><p id="crop-source-help" class="sr-only"></p>
<section id="avatar-crop" aria-label="正方形頭像裁切" hidden>
<canvas id="crop-canvas" width="320" height="320" tabindex="0" aria-label="頭像裁切區，可拖曳圖片或用方向鍵移動"></canvas>
<div class="crop-controls"><label>縮放<input id="crop-zoom" type="range" min="1" max="4" step="0.01" value="1"></label></div>
<button id="confirm-avatar-crop" type="button">確認裁切</button><button id="cancel-avatar-crop" type="button">取消裁切</button>
</section><p id="avatar-error" class="field-error" role="alert"></p></section>
<section id="library-settings" role="tabpanel" aria-labelledby="library-settings-tab" tabindex="0" hidden>
<ul id="portrait-library" aria-label="我的最愛，共六個位置" tabindex="-1"></ul>
<section id="collection-editor" hidden aria-label="新增或更換收藏立繪"><canvas id="collection-canvas" width="300" height="400" tabindex="0" aria-label="收藏立繪裁切區，可拖曳或用方向鍵移動"></canvas><label>縮放<input id="collection-zoom" type="range" min="1" max="4" step="0.01" value="1"></label><button id="confirm-collection" type="button">新增</button><button id="cancel-collection" type="button">取消新增</button></section><p id="portraits-error" class="field-error" role="alert"></p>
</section></section>
</div><div class="settings-footer"><p id="image-status" class="small-note" role="status" aria-live="polite"></p><p id="form-error" role="alert"></p><div class="form-actions"><button id="save-settings" type="submit">儲存</button><button id="cancel-profile" type="button">取消</button></div>
</div></form></dialog>
<dialog id="portrait-actions-dialog" aria-labelledby="portrait-actions-title"><h2 id="portrait-actions-title" class="sr-only">立繪操作</h2><div class="portrait-dialog-actions"><button type="button" data-action="select">選用</button><button type="button" data-action="replace">更換</button><button type="button" data-action="delete">刪除</button></div><button id="close-portrait-actions" type="button" aria-label="關閉立繪操作"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="m8 8 8 8M16 8l-8 8"/></svg></button></dialog><dialog id="unsaved-settings-dialog" aria-labelledby="unsaved-settings-title"><p id="unsaved-settings-title">有尚未儲存的變更，是否儲存？</p><div class="form-actions"><button id="save-unsaved-settings" type="button">儲存</button><button id="cancel-unsaved-settings" type="button">取消</button></div></dialog></body></html>
