<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Life System 首頁視覺提案，以清楚而平靜的方式整理日常。">
    <title>今日生活 · Life System</title>
    <link rel="icon" href="data:,">
    <script src="assets/appearance-core.js" data-appearance-core></script>
    <link rel="stylesheet" href="assets/styles.css?v=publish-20261022">
    <script type="module" src="assets/home.js?v=publish-20261022"></script>
  <link rel="stylesheet" href="assets/appearance.css?v=publish-20261022">
  </head>
  <body>
    <a class="skip-link" href="#main">跳至主要內容</a>
    <div class="page-shell">
      <main id="main" tabindex="-1">
        <div class="desktop-navigation" aria-label="電腦版導覽工具列">
          <nav id="desktop-links" class="navigation-options" aria-label="主要導覽"></nav>
          <button class="toolbar-button undo-button" type="button" data-undo disabled aria-label="撤銷上一個資料操作" title="撤銷上一個資料操作"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5-6 6 6 6M3 11h10a7 7 0 0 1 7 7"/></svg></button>
        </div>

        <div class="intro">
          <div class="date-block"><span class="date-caption">示意日期</span><time datetime="2026-10-21"><span class="date-numbers">10<span class="date-divider">/</span>21</span><span class="date-detail">2026 年・星期三</span></time></div>
          <div class="welcome-copy"><span id="current-page-name" class="current-page-name desktop-page-name"></span><h1>慢慢成長，慢慢變好</h1><p class="eyebrow" lang="en">A little space for everyday life</p></div>
        </div>

        <div class="dashboard">

        <section class="companion" aria-label="夥伴對話" data-mode="mock">
          <div class="companion-banner">
            <div class="companion-portrait" data-emotion="neutral" role="img" aria-label="夥伴頭像佔位：平靜，尚未提供情緒立繪">
              <img id="companion-image" alt="" hidden>
              <div id="portrait-placeholder"><span>頭像佔位</span><span id="portrait-emotion">平靜</span></div>
            </div>
            <div class="dialogue-column">
              <div class="dialogue-bubble" aria-live="polite" aria-atomic="true"><p id="companion-dialogue">完成待辦或習慣打卡後，這裡會顯示模擬回應。</p></div>
              <p class="sr-only" id="companion-status" role="status">尚未產生新回應。</p>
            </div>
          </div>
          <p class="small-note companion-note">目前為模擬回應，尚未串接 AI</p>
        </section>


        <div class="daily-panel">


        <div id="home-stats" class="profile-summary" role="group" aria-label="個人資料摘要">Lv 1 ｜ Exp —｜ $ —</div>

        <p class="demo-notice"><span class="demo-mark">示意資料</span><span>本頁為排版預覽；勾選僅供體驗，狀態與操作紀錄保存在此瀏覽器。</span></p>

        <div class="activity-region">
        <div class="activity-tabs" aria-label="今日行動切換" hidden>
          <button type="button" id="tasks-tab" data-panel="tasks-panel"><span>今日待辦</span></button>
          <button type="button" id="habits-tab" data-panel="habits-panel"><span>彈性打卡</span></button>
        </div>
        <div class="home-grid">
          <section id="tasks-panel" class="tasks" aria-labelledby="tasks-title">
            <div class="section-heading"><div><h2 id="tasks-title">今日待辦</h2><p class="section-kicker" lang="en">One thing at a time</p></div><span class="count" id="task-count" aria-live="polite" aria-atomic="true">1 / 4 完成</span></div>
            <ul class="task-list">
              <li><label class="task-row"><input type="checkbox" data-task><span class="task-content"><span class="task-name">整理桌面，留出一小塊空間</span></span><span class="task-time">上午</span></label></li>
              <li><label class="task-row"><input type="checkbox" data-task><span class="task-content"><span class="task-name">讀幾頁想讀的書</span></span><span class="task-time">午後</span></label></li>
              <li><label class="task-row"><input type="checkbox" data-task><span class="task-content"><span class="task-name">寫下今天想記住的一件事</span></span><span class="task-time">晚上</span></label></li>
              <li><label class="task-row"><input type="checkbox" data-task checked><span class="task-content"><span class="task-name">為自己準備一份早餐</span></span><span class="task-time">上午</span></label></li>
            </ul>
            <div class="section-bottom"><span class="small-note">以上皆為示意待辦</span><button class="text-button" type="button" disabled><span aria-hidden="true">＋</span> 新增待辦 <span>尚未啟用</span></button></div>
          </section>

          <section id="habits-panel" class="habits" aria-labelledby="habits-title">
            <div class="section-heading"><div><h2 id="habits-title">今日彈性習慣</h2><p class="section-kicker" lang="en">Small steps, your own pace</p></div><span class="section-label">示意打卡</span></div>
            <ul class="habit-list">
              <li><label class="habit-row"><span class="habit-index" aria-hidden="true">01</span><span class="habit-content"><span class="habit-name">喝一杯水</span></span><input type="checkbox" data-habit><span class="habit-state" aria-hidden="true">未打卡</span></label></li>
              <li><label class="habit-row"><span class="habit-index" aria-hidden="true">02</span><span class="habit-content"><span class="habit-name">起身舒展</span></span><input type="checkbox" data-habit checked><span class="habit-state" aria-hidden="true">已打卡</span></label></li>
              <li><label class="habit-row"><span class="habit-index" aria-hidden="true">03</span><span class="habit-content"><span class="habit-name">留一點安靜</span></span><input type="checkbox" data-habit><span class="habit-state" aria-hidden="true">未打卡</span></label></li>
            </ul>
            <p class="small-note habit-note">以上皆為示意習慣，尚未設定打卡規則。</p>
          </section>


        </div>
        </div>
        <p id="operation-status" class="small-note" role="status" hidden></p>
        </div>
        </div>
      </main>
    </div>
    <div class="mobile-navigation" hidden><nav id="mobile-links" class="navigation-options" aria-label="主要導覽"></nav><div class="mobile-undo"><button class="toolbar-button undo-button" type="button" data-undo disabled aria-label="撤銷上一個資料操作" title="撤銷上一個資料操作"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m9 5-6 6 6 6M3 11h10a7 7 0 0 1 7 7"/></svg></button></div></div>
  </body>
</html>
